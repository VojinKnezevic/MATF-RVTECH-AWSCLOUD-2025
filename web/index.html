<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV Punjači - Mapa</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .search-form {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      input[type="text"] {
        padding: 0.6rem 1rem;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        width: 200px;
      }

      button {
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        background: white;
        color: #667eea;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .sync-btn {
        background: rgba(255,255,255,0.2);
        color: white;
        border: 1px solid rgba(255,255,255,0.3);
      }

      #status {
        font-size: 0.9rem;
        padding: 0.5rem 1rem;
        background: rgba(255,255,255,0.1);
        border-radius: 6px;
      }

      #map {
        flex: 1;
        min-height: 500px;
      }

      .charger-popup {
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .charger-popup h3 {
        margin-bottom: 0.5rem;
        color: #667eea;
      }

      .charger-popup p {
        margin: 0.2rem 0;
      }

      .charger-popup .label {
        font-weight: bold;
        color: #555;
      }

      footer {
        background: #333;
        color: white;
        padding: 0.8rem;
        text-align: center;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>⚡ EV Punjači - Srbija</h1>
      <div class="search-form">
        <input type="text" id="townInput" placeholder="Unesite grad (npr. Belgrade)" value="Belgrade" />
        <button id="searchBtn">Pretraži</button>
        <button id="syncBtn" class="sync-btn">Sync OCM</button>
      </div>
      <div id="status"></div>
    </header>

    <div id="map"></div>

    <footer>
      Podaci: <a href="https://openchargemap.org" target="_blank" style="color: #667eea;">Open Charge Map</a> | 
      LocalStack Demo
    </footer>
  </body>
</html>
